<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&display=block">
<style>
  /* Share card, 1200 × 630 (rendered to dist/assets/og.jpg): the page as it opens. The walk drawing runs the card's
     width, a little trimmed top and bottom, with Muybridge's plate in the clearing the pencil left for it (half the
     drawing's width, as on the page); under it the title, set as on the page and at the same share of the width. */
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
  .cover{position:absolute;left:0;top:-38px;width:1200px;aspect-ratio:2800/1169}
  .cover img{display:block;width:100%;height:100%}
  .plate{position:absolute;left:50%;top:50%;width:50%;transform:translate(-50%,-50%)}
  .plate img{display:block;width:100%;height:auto}
  h1{position:absolute;left:0;right:0;bottom:36px;margin:0;color:#000;font:500 54px/1 "IBM Plex Sans","Helvetica Neue",sans-serif;
    letter-spacing:-.035em;text-align:center;-webkit-font-smoothing:antialiased;font-kerning:normal}
  h1 span{display:block}
</style>
</head>
<body>
  <div class="cover">
    <img src="dist/assets/walk.webp" alt="">
    <div class="plate"><img src="dist/assets/walking.webp" alt=""></div>
  </div>
  <h1>Scaling the Human Experience: <span>An Engine to Fight Brute Force</span></h1>
</body>
</html>
