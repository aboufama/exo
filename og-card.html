<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Share card, 1200 × 630 (rendered to dist/assets/og.jpg): Muybridge's walking plate at full height on its own
     dark border, with the Lithe mark over it. At the centre the mark sits in the gap between the walkers of
     frames 9 and 10, over grid and gutter, so no figure is covered. */
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1c1e1d}
  body{position:relative;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;font-synthesis:none}
  .plate{position:absolute;left:50%;top:0;height:630px;width:auto;display:block;transform:translateX(-50%)}
  .brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;padding:.3em .5em;background:#fff;
    font-size:46px;line-height:1;letter-spacing:-.02em;color:#ec7aa4}
</style>
</head>
<body>
  <img class="plate" src="dist/assets/walking.webp" alt="">
  <span class="brand">Lithe</span>
</body>
</html>
