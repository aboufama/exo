<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Share card, 1200 × 630 (rendered to dist/assets/og.jpg): the top of the page. The walk drawing fills the card (its
     lines run off every edge anyway), with Muybridge's plate centred in the clearing the pencil left for it, as on
     the page: half the drawing's width. */
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
  .cover{position:absolute;left:50%;top:0;height:630px;aspect-ratio:2800/1169;transform:translateX(-50%)}
  .cover img{display:block;width:100%;height:100%}
  .plate{position:absolute;left:50%;top:50%;width:50%;transform:translate(-50%,-50%)}
  .plate img{display:block;width:100%;height:auto}
</style>
</head>
<body>
  <div class="cover">
    <img src="dist/assets/walk.webp" alt="">
    <div class="plate"><img src="dist/assets/walking.webp" alt=""></div>
  </div>
</body>
</html>
