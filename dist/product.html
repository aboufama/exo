<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Lithe — Product</title>
  <meta name="description" content="Human augmentation Suit 1: coming soon.">
  <link rel="canonical" href="https://lithe.site/product.html">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preload" href="./fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <!-- The product: an empty page, only the exoskeleton's silhouette at rest, arms hanging relaxed (the real v3 CAD,
       seen from behind, as rendered; assets/exo.webp is that render cropped to its edges), with one small line under
       it. Under the silhouette, the site's shadow: a fine dither (one pixel in four), offset down and to the right, cut
       to its shape, printed like a two-ink riso: a pink layer a little out of register under the black. "Coming soon"
       is marked as a reader would select it, in the selection pink. No drawings: those stay on the manifesto. The
       tabs are the home page's. -->
  <style>
    body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
    .product{position:relative;flex:1;display:grid;place-items:center;padding:var(--gutter)}
    .product figure{margin:0}
    .exo{position:relative;isolation:isolate;width:min(64vw,calc(50svh * 1848 / 1358),1000px);aspect-ratio:1848/1358}
    @media(max-width:600px){.exo{width:min(88vw,calc(50svh * 1848 / 1358))}}
    .exo img{display:block;width:100%;height:100%}
    .exo::before,.exo::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 100%) 0 0/2px 2px;-webkit-mask:url(./assets/exo.webp) 0 0/100% 100% no-repeat;mask:url(./assets/exo.webp) 0 0/100% 100% no-repeat}
    .exo::before{z-index:-1;translate:var(--shadow-off,5px) var(--shadow-off,5px)}
    .exo::after{z-index:-2;translate:calc(var(--shadow-off,5px) + 2px) calc(var(--shadow-off,5px) + 2px);background-image:repeating-conic-gradient(var(--accent) 0 25%,transparent 0 100%);background-position:1px 1px}
    .product mark{padding:1px 2px;margin:0 -2px;background:var(--blush);color:var(--ink)}
    .product figcaption{margin-top:clamp(20px,3svh,36px);font-family:var(--f-label);font-size:var(--note);font-weight:var(--note-w,400);line-height:1.35;letter-spacing:var(--label-t,.01em);color:var(--ink-soft);text-align:center}
    .product~.tabs{padding-top:0}
    .product~.tabs::before{display:none}
  </style>
</head>
<body>
  <main class="product">
    <figure>
      <div class="exo">
        <img src="./assets/exo.webp" width="1848" height="1358" alt="The Lithe exoskeleton at rest, seen from behind: a spine and shoulder frame, its arms hanging relaxed.">
      </div>
      <figcaption>Human augmentation Suit 1: <mark>Coming soon.</mark></figcaption>
    </figure>
  </main>

  <footer class="tabs">
    <span class="tab">Lithe 2026</span>
    <nav class="tab-group pages" aria-label="Pages">
      <a class="tab" href="./product.html" aria-current="page">Product</a>
      <a class="tab" href="./">Manifesto</a>
    </nav>
    <nav class="tab-group" aria-label="Contact">
      <a class="tab" href="#" data-soon>Waitlist</a>
      <a class="tab" href="#" data-soon>X</a>
      <a class="tab" href="#" data-soon>Email</a>
    </nav>
  </footer>

  <script type="module" src="./soon.js"></script>
</body>
</html>
