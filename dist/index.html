<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>EXO</title>
  <meta name="description" content="EXO. A study in movement.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M8 6h17v4H12v4h11v4H12v4h13v4H8z' fill='black'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="preload" href="./assets/standing.png" as="image">
  <link rel="preload" href="./assets/InstrumentSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <main id="journey" aria-label="EXO — scroll to unfold the exoskeleton">
    <div class="stage" id="stage">
      <div id="model" role="img" aria-label="Black silhouette of the EXO exoskeleton. Its shoulder and arm mechanisms unfold as you scroll."></div>
      <img id="poster" class="poster" src="./assets/standing.png" alt="" aria-hidden="true" width="1600" height="900">
      <div id="identity" aria-hidden="true">
        <h1 id="wordmark">EXO</h1>
        <p>Full body strength enhancement and data collection</p>
      </div>
      <div class="loading-line" id="loading-line" aria-hidden="true"></div>
      <p class="sr-only">Scroll, or use the arrow and Page Down keys, to move from standing to a fully extended pose. The name appears at the end.</p>
      <noscript><style>#identity{opacity:1;visibility:visible;transform:translateX(-50%)}.loading-line{display:none}</style></noscript>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
